<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELNKOSC: The Pragmatic Programmer</title>
<meta name="description" content="ELNKOSC's GitHub Repo">
<meta name="keywords" content="github, stromer, ebike, api, python, crypto">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --dark-green: #003b00;
    --green: #008f11;
    --matrix: #00ff41;
    --glow: rgba(0, 255, 65, 0.65);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--black);
    color: var(--matrix);
    overflow: hidden;
  }

  body {
    font-family: "Share Tech Mono", "Courier New", monospace;
  }

  #rain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  /* Game layer: played faintly behind the text like a watermark */
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
    opacity: 0.75;
    pointer-events: none;
  }

  /* CRT scanlines + vignette */
  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }
  body::before {
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.25) 3px
    );
  }
  body::after {
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.85) 100%);
  }

  main {
    position: relative;
    z-index: 2;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .terminal {
    width: min(760px, 100%);
    padding: clamp(20px, 5vw, 44px);
    background: rgba(0, 10, 0, 0.6);
    border: 1px solid var(--green);
    box-shadow:
      0 0 18px rgba(0, 255, 65, 0.25),
      inset 0 0 40px rgba(0, 59, 0, 0.6);
  }

  /* Coat-of-arms watermark, centred behind the text */
  .terminal { position: relative; overflow: hidden; }
  .terminal > :not(.crest) { position: relative; z-index: 1; }
  .crest {
    position: absolute;
    left: 50%;
    top: 50%;
    height: 92%;
    max-width: 80%;
    object-fit: contain;
    transform: translate(-50%, -50%);
    opacity: 0.16;
    filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.6));
    pointer-events: none;
    user-select: none;
    z-index: 0;
    animation: crest-pulse 7s ease-in-out infinite;
  }

  @keyframes crest-pulse {
    0%, 100% { opacity: 0.14; }
    50% { opacity: 0.22; }
  }

  .prompt {
    margin: 0 0 18px;
    font-size: 14px;
    color: var(--green);
    letter-spacing: 0.08em;
  }

  h1 {
    margin: 0 0 28px;
    font-family: "VT323", "Share Tech Mono", monospace;
    font-weight: normal;
    font-size: clamp(34px, 7vw, 64px);
    line-height: 1;
    letter-spacing: 0.04em;
    color: var(--matrix);
    text-shadow: 0 0 6px var(--glow), 0 0 22px var(--glow);
    animation: flicker 6s infinite;
  }

  h1 .sub {
    display: block;
    margin-top: 8px;
    font-size: 0.55em;
    color: #b6ffc4;
    text-shadow: 0 0 6px var(--glow);
  }

  blockquote {
    margin: 0;
    padding-left: 16px;
    border-left: 2px solid var(--green);
  }

  blockquote p {
    margin: 0 0 14px;
    font-size: clamp(16px, 2.6vw, 20px);
    line-height: 1.55;
    color: #c8ffd4;
    text-shadow: 0 0 4px rgba(0, 255, 65, 0.5);
  }

  blockquote footer {
    font-size: 14px;
    color: var(--green);
  }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    margin-left: 4px;
    vertical-align: text-bottom;
    background: var(--matrix);
    box-shadow: 0 0 8px var(--glow);
    animation: blink 1s steps(1) infinite;
  }

  /* Typing effect: hidden until revealed by JS (only when JS runs) */
  .js [data-type] { visibility: hidden; }
  .js [data-type].typing,
  .js [data-type].typed { visibility: visible; }

  @keyframes blink { 50% { opacity: 0; } }

  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.6; }
    94% { opacity: 1; }
    96% { opacity: 0.75; }
    97% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1, .cursor, .crest { animation: none; }
  }
</style>
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<canvas id="game" aria-hidden="true"></canvas>

<main>
  <section class="terminal">
    <img class="crest" src="img/crest.png" alt="" aria-hidden="true">
    <p class="prompt" aria-hidden="true">&gt; root@elnkosc:~$ ./wake_up --neo</p>

    <h1 data-type>ELNKOSC:<span class="sub">The Pragmatic Programmer</span></h1>

    <blockquote>
      <p data-type>“Now I'm a pretty lazy person and am prepared to work quite hard in order to avoid work.”</p>
      <footer data-type>― Martin Fowler, Refactoring: Improving the Design of Existing Code</footer>
    </blockquote>
    <span class="cursor" aria-hidden="true"></span>
  </section>
</main>

<script>
(function () {
  "use strict";

  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Digital rain ---------- */
  var canvas = document.getElementById("rain");
  var ctx = canvas.getContext("2d");
  var glyphs = (
    "ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ" +
    "0123456789Z:・.\"=*+-<>¦｜╌ç"
  ).split("");
  var fontSize, columns, drops, speeds;

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fontSize = window.innerWidth < 600 ? 14 : 18;
    columns = Math.ceil(window.innerWidth / fontSize);
    drops = [];
    speeds = [];
    for (var i = 0; i < columns; i++) {
      drops[i] = Math.random() * -(window.innerHeight / fontSize);
      speeds[i] = 0.35 + Math.random() * 0.75;
    }
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  }

  function randomGlyph() {
    return glyphs[(Math.random() * glyphs.length) | 0];
  }

  function draw() {
    var w = window.innerWidth, h = window.innerHeight;
    // translucent black leaves fading trails
    ctx.fillStyle = "rgba(0, 0, 0, 0.07)";
    ctx.fillRect(0, 0, w, h);
    ctx.font = fontSize + "px 'Share Tech Mono', monospace";
    ctx.textBaseline = "top";

    for (var i = 0; i < columns; i++) {
      var x = i * fontSize;
      var y = Math.floor(drops[i]) * fontSize;

      // body of the stream
      ctx.fillStyle = Math.random() > 0.9 ? "#00ff41" : "#008f11";
      ctx.fillText(randomGlyph(), x, y - fontSize);

      // bright, glowing leading character
      ctx.shadowColor = "#00ff41";
      ctx.shadowBlur = 8;
      ctx.fillStyle = "#d9ffe2";
      ctx.fillText(randomGlyph(), x, y);
      ctx.shadowBlur = 0;

      drops[i] += speeds[i];
      if (y > h && Math.random() > 0.975) {
        drops[i] = 0;
        speeds[i] = 0.35 + Math.random() * 0.75;
      }
    }
  }

  function staticRain() {
    // Reduced motion: a single still frame of scattered glyphs
    ctx.font = fontSize + "px 'Share Tech Mono', monospace";
    ctx.textBaseline = "top";
    for (var i = 0; i < columns; i++) {
      var len = (Math.random() * 25) | 0;
      var start = (Math.random() * (window.innerHeight / fontSize)) | 0;
      for (var j = 0; j < len; j++) {
        ctx.fillStyle = "rgba(0, 143, 17," + (j / len) * 0.8 + ")";
        ctx.fillText(randomGlyph(), i * fontSize, (start + j) * fontSize);
      }
    }
  }

  resize();
  window.addEventListener("resize", function () {
    resize();
    if (reduceMotion) staticRain();
  });

  if (reduceMotion) {
    staticRain();
  } else {
    var last = 0;
    (function loop(t) {
      if (t - last > 33) { draw(); last = t; } // ~30 fps
      requestAnimationFrame(loop);
    })(0);
  }

  /* ---------- Typing effect ---------- */
  var targets = Array.prototype.slice.call(document.querySelectorAll("[data-type]"));

  function typeNode(el, done) {
    // Collect text nodes, blank them, then refill char by char
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = walker.nextNode())) {
      nodes.push({ node: n, text: n.nodeValue });
      n.nodeValue = "";
    }
    el.classList.add("typing");
    var ni = 0, ci = 0;
    (function step() {
      if (ni >= nodes.length) {
        el.classList.remove("typing");
        el.classList.add("typed");
        return setTimeout(done, 350);
      }
      var cur = nodes[ni];
      ci++;
      cur.node.nodeValue = cur.text.slice(0, ci);
      if (ci >= cur.text.length) { ni++; ci = 0; }
      setTimeout(step, 22 + Math.random() * 45);
    })();
  }

  if (reduceMotion) {
    targets.forEach(function (el) { el.classList.add("typed"); });
  } else {
    var idx = 0;
    (function next() {
      if (idx < targets.length) typeNode(targets[idx++], next);
    })();
  }
})();
</script>
<script>
/* ---------- "Glitch Defender": a small shooter played in the watermark layer ---------- */
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var GLYPHS = "ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ01".split("");
  var W, H, cell;
  var keys = { left: false, right: false, fire: false };
  var mode = "demo";            // "demo" | "play" | "over"
  var player, shots, bombs, glitches, sparks, score, lives, wave, cooldown, idleTimer, overTimer, invuln;

  function glyph() { return GLYPHS[(Math.random() * GLYPHS.length) | 0]; }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = W < 600 ? 9 : 12;
    if (player) player.y = H - cell * 4;
  }

  function reset() {
    player = { x: W / 2, y: H - cell * 4, speed: 0 };
    shots = []; bombs = []; glitches = []; sparks = [];
    score = 0; lives = 3; wave = 0; cooldown = 0; invuln = 0;
    nextWave();
  }

  function nextWave() {
    wave++;
    var count = Math.min(6 + wave * 2, 22);
    for (var i = 0; i < count; i++) {
      glitches.push({
        x: cell * 3 + Math.random() * (W - cell * 6),
        y: -cell * 3 - Math.random() * H * 0.3,
        vy: 0.25 + Math.random() * 0.25 + wave * 0.06,
        phase: Math.random() * Math.PI * 2,
        sway: 0.6 + Math.random() * 1.4,
        cells: [glyph(), glyph(), glyph(), glyph()],
        hp: Math.random() < Math.min(0.1 * wave, 0.5) ? 2 : 1
      });
    }
  }

  function explode(x, y) {
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, g: glyph() });
    }
  }

  function hitPlayer() {
    if (invuln > 0) return;
    explode(player.x, player.y);
    lives--; invuln = 90;
    if (lives <= 0) {
      if (mode === "play") { mode = "over"; overTimer = 0; }
      else reset();
    }
  }

  function fire() {
    if (cooldown > 0) return;
    shots.push({ x: player.x, y: player.y - cell * 1.5 });
    cooldown = 14;
  }

  function autopilot() {
    // Demo mode: chase the lowest glitch and shoot at it
    var target = null;
    for (var i = 0; i < glitches.length; i++) {
      var g = glitches[i];
      if (g.y > 0 && (!target || g.y > target.y)) target = g;
    }
    var dx = target ? target.gx - player.x : W / 2 - player.x;
    keys.left = dx < -cell; keys.right = dx > cell;
    keys.fire = !!target && Math.abs(dx) < cell * 2;
  }

  function update() {
    if (mode === "demo") autopilot();
    if (mode === "over") {
      overTimer++;
      if (overTimer > 60 * 10) { mode = "demo"; reset(); }
      return;
    }
    if (mode === "play" && ++idleTimer > 60 * 30) { mode = "demo"; reset(); }

    var accel = 0.9, max = 7;
    if (keys.left) player.speed = Math.max(player.speed - accel, -max);
    else if (keys.right) player.speed = Math.min(player.speed + accel, max);
    else player.speed *= 0.75;
    player.x = Math.max(cell * 2, Math.min(W - cell * 2, player.x + player.speed));
    if (keys.fire) fire();
    if (cooldown > 0) cooldown--;
    if (invuln > 0) invuln--;

    var i, j;
    for (i = shots.length - 1; i >= 0; i--) {
      shots[i].y -= 10;
      if (shots[i].y < -20) shots.splice(i, 1);
    }
    for (i = bombs.length - 1; i >= 0; i--) {
      var b = bombs[i];
      b.y += 3.2;
      if (Math.abs(b.x - player.x) < cell * 1.5 && Math.abs(b.y - player.y) < cell) { bombs.splice(i, 1); hitPlayer(); continue; }
      if (b.y > H + 20) bombs.splice(i, 1);
    }
    for (i = glitches.length - 1; i >= 0; i--) {
      var g = glitches[i];
      g.phase += 0.03;
      g.y += g.vy;
      g.gx = g.x + Math.sin(g.phase) * cell * 4 * g.sway;
      if (Math.random() < 0.04) g.cells[(Math.random() * 4) | 0] = glyph();
      if (g.y > cell && Math.random() < 0.0015 + wave * 0.0004) bombs.push({ x: g.gx, y: g.y + cell, g: glyph() });

      for (j = shots.length - 1; j >= 0; j--) {
        if (Math.abs(shots[j].x - g.gx) < cell * 1.3 && Math.abs(shots[j].y - g.y) < cell * 1.3) {
          shots.splice(j, 1);
          if (--g.hp <= 0) { explode(g.gx, g.y); glitches.splice(i, 1); score += 10 * wave; }
          break;
        }
      }
      if (glitches[i] !== g) continue;
      if (g.y > player.y - cell) {
        glitches.splice(i, 1);
        if (Math.abs(g.gx - player.x) < cell * 3) hitPlayer(); else score = Math.max(0, score - 5);
      }
    }
    for (i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05;
      if (--s.life <= 0) sparks.splice(i, 1);
    }
    if (!glitches.length) nextWave();
  }

  function text(str, x, y, size, color, align) {
    ctx.font = size + "px 'VT323', 'Share Tech Mono', monospace";
    ctx.textAlign = align || "left";
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.textBaseline = "middle";
    ctx.shadowColor = "#00ff41";
    ctx.shadowBlur = 10;
    var i;

    // Glitches: 2x2 blocks of flickering glyphs
    ctx.font = (cell * 1.3) + "px 'Share Tech Mono', monospace";
    ctx.textAlign = "center";
    for (i = 0; i < glitches.length; i++) {
      var g = glitches[i];
      ctx.fillStyle = "rgba(0, 12, 0, 0.9)";
      ctx.fillRect(g.gx - cell * 1.6, g.y - cell * 1.6, cell * 3.2, cell * 3.2);
      ctx.strokeStyle = g.hp > 1 ? "#d9ffe2" : "#00ff41";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(g.gx - cell * 1.6, g.y - cell * 1.6, cell * 3.2, cell * 3.2);
      ctx.fillStyle = g.hp > 1 ? "#d9ffe2" : "#00ff41";
      ctx.fillText(g.cells[0], g.gx - cell * 0.7, g.y - cell * 0.7);
      ctx.fillText(g.cells[1], g.gx + cell * 0.7, g.y - cell * 0.7);
      ctx.fillText(g.cells[2], g.gx - cell * 0.7, g.y + cell * 0.7);
      ctx.fillText(g.cells[3], g.gx + cell * 0.7, g.y + cell * 0.7);
    }

    // Shots and bombs
    ctx.fillStyle = "#d9ffe2";
    for (i = 0; i < shots.length; i++) ctx.fillRect(shots[i].x - 1, shots[i].y - cell, 2, cell * 1.4);
    ctx.fillStyle = "#00ff41";
    for (i = 0; i < bombs.length; i++) ctx.fillText(bombs[i].g, bombs[i].x, bombs[i].y);

    // Sparks
    for (i = 0; i < sparks.length; i++) {
      ctx.globalAlpha = sparks[i].life / 30;
      ctx.fillText(sparks[i].g, sparks[i].x, sparks[i].y);
    }
    ctx.globalAlpha = 1;

    // Player: a chevron-shaped "cursor ship"
    if (mode !== "over" && (invuln === 0 || (invuln >> 3) % 2 === 0)) {
      var x = player.x, y = player.y, c = cell;
      ctx.fillStyle = "#d9ffe2";
      ctx.beginPath();
      ctx.moveTo(x, y - c * 1.4);
      ctx.lineTo(x + c * 1.8, y + c);
      ctx.lineTo(x + c * 0.6, y + c * 0.4);
      ctx.lineTo(x - c * 0.6, y + c * 0.4);
      ctx.lineTo(x - c * 1.8, y + c);
      ctx.closePath();
      ctx.fill();
    }

    // HUD
    ctx.shadowBlur = 6;
    var hud = W < 600 ? 18 : 24;
    text("SCORE " + ("00000" + score).slice(-6), 16, hud, hud, "#00ff41");
    text("WAVE " + wave + "   " + new Array(Math.max(lives, 0) + 1).join("▮ "), W - 16, hud, hud, "#00ff41", "right");
    if (mode === "demo") {
      text("← → BEWEGEN  ·  SPATIE SCHIETEN", W / 2, H - cell * 1.3, hud * 0.8, "#008f11", "center");
    } else if (mode === "over") {
      text("GAME OVER", W / 2, H * 0.82, hud * 2, "#00ff41", "center");
      text("SPATIE = OPNIEUW", W / 2, H * 0.82 + hud * 1.6, hud * 0.9, "#008f11", "center");
    }
    ctx.shadowBlur = 0;
  }

  function onKey(e, down) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    var map = { ArrowLeft: "left", ArrowRight: "right", " ": "fire", Spacebar: "fire" };
    if (!map[k]) return;
    e.preventDefault();
    if (down && (mode === "demo" || (mode === "over" && map[k] === "fire"))) {
      mode = "play"; reset();
      keys.left = keys.right = keys.fire = false;
      start();
    }
    if (mode === "play") { keys[map[k]] = down; idleTimer = 0; }
  }

  var running = false, last = 0;
  function loop(t) {
    // fixed ~60 updates per second, independent of display refresh rate
    if (!last) last = t;
    var steps = Math.min(5, Math.floor((t - last) / 16.67));
    for (var i = 0; i < steps; i++) update();
    if (steps) last += steps * 16.67;
    draw();
    if (reduceMotion && mode === "demo") { running = false; ctx.clearRect(0, 0, W, H); return; }
    requestAnimationFrame(loop);
  }
  function start() {
    if (running) return;
    running = true; last = 0;
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  idleTimer = 0;
  window.addEventListener("resize", resize);
  window.addEventListener("keydown", function (e) { onKey(e, true); });
  window.addEventListener("keyup", function (e) { onKey(e, false); });
  window.addEventListener("blur", function () { keys.left = keys.right = keys.fire = false; });

  // With reduced motion the demo does not run; pressing a key starts a game.
  if (!reduceMotion) start();
})();
</script>
</body>
</html>
